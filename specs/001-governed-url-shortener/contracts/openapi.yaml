openapi: 3.0.3
info:
  title: Governed Agentic URL Shortener API
  version: 0.1.0-proposed
  description: >
    PROPOSED contract, not yet approved (Human Gate 4 pending). Traces to
    spec.md FR-101..FR-116 (domain), FR-201..FR-206/FR-501..FR-503
    (orchestration), FR-301..FR-313 (governance), FR-401..FR-406
    (reliability), FR-601..FR-606 (audit/metrics). Backward-compatibility and
    versioning rules: see the "Compatibility and Change Control" section at
    the bottom of this file. Any change to this contract requires impact
    analysis and change approval per FR-306.
servers:
  - url: http://localhost:8000
    description: Local demonstration instance (ADR-0010)

security:
  - {}  # domain endpoints are unauthenticated per spec Exclusions (no end-user auth)

paths:
  /health:
    get:
      summary: Operational health (FR-111) and analytics-degradation observability (FR-115)
      operationId: getHealth
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /short-links:
    post:
      summary: Create a short link (FR-101, FR-102, FR-104, FR-108, FR-112, FR-113, FR-114)
      operationId: createShortLink
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Optional. See FR-108/FR-112/FR-113 (AMB-001 resolution).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortLinkCreateRequest"
      responses:
        "201":
          description: Created (or, for an identical idempotent replay, the original result — FR-112)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkCreateResponse"
        "400":
          description: Invalid URL, disallowed scheme, or invalid expiresAt (FR-101, FR-114)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Idempotency-Key reused with a different, mismatched payload (FR-113)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Short-code allocation temporarily exhausted (ADR-0004 bounded retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /{shortCode}:
    get:
      summary: Resolve and redirect (FR-103, FR-104, FR-105)
      operationId: resolveShortLink
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to destination_url; increments analytics (FR-105) via durable outbox (ADR-0009)
        "404":
          description: Unknown short code (FR-103)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Expired short code — distinct from 404 (FR-103, FR-104)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /short-links/{shortCode}/analytics:
    get:
      summary: Analytics summary (FR-105, FR-107, AMB-002)
      operationId: getShortLinkAnalytics
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregate analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkAnalyticsSummary"
        "404":
          description: Unknown short code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /short-links/{shortCode}:
    delete:
      summary: Delete a short link (does not delete its idempotency record — FR-116)
      operationId: deleteShortLink
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown short code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workflows:
    post:
      summary: Ingest a requirement, creating a workflow instance (FR-201, FR-206, FR-601)
      operationId: createWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"

  /workflows/{workflowId}:
    get:
      summary: Inspect workflow state, dependency graph, and decision lineage (FR-201, FR-204, FR-206, FR-503)
      operationId: getWorkflow
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full workflow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstance"
        "404":
          description: Unknown workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workflows/{workflowId}/gates/{gateId}/approve:
    post:
      summary: Approve a mandatory human-approval gate (FR-301, FR-302, FR-307..FR-313)
      operationId: approveGate
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: gateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecision"
        "401":
          description: Unauthenticated (FR-307)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated but wrong role for this gate, or an agent identity (FR-307, FR-309, FR-312)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Artifact revision has changed since gate entry — stale approval attempt (FR-311)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workflows/{workflowId}/gates/{gateId}/reject:
    post:
      summary: Reject a mandatory human-approval gate (FR-302)
      operationId: rejectGate
      security:
        - bearerAuth: []
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
        - name: gateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "200":
          description: Rejection recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecision"

  /workflows/{workflowId}/audit-events:
    get:
      summary: Audit trail for a workflow instance (FR-601, FR-602)
      operationId: getWorkflowAuditEvents
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered list of audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"

  /workflows/{workflowId}/policy-evaluations:
    get:
      summary: Policy evaluation outcomes for this workflow instance (FR-303)
      operationId: getWorkflowPolicyEvaluations
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered list of policy evaluations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyEvaluation"

  /metrics/reliability:
    get:
      summary: Reliability and orchestration measurements (FR-603, FR-604) — demonstration data, never production statistics
      operationId: getReliabilityMetrics
      responses:
        "200":
          description: Metrics, explicitly labeled as demonstration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilityMetrics"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Verified per-role credential (ADR-0006). Never a caller-supplied
        name. Never held by the orchestration/agent process in raw form —
        see ADR-0006's isolation mechanism.

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
        requirement_ref:
          type: string
          description: FR identifier this rejection enforces, for traceability

    ShortLinkCreateRequest:
      type: object
      required: [destination_url]
      properties:
        destination_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Must be strictly future if supplied (FR-114); no default expiration if omitted (FR-104/AMB-006).

    ShortLinkCreateResponse:
      type: object
      required: [short_code, destination_url, created_at]
      properties:
        short_code:
          type: string
        destination_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        idempotent_replay:
          type: boolean
          description: true if this result was returned from an existing idempotency record (FR-112), not newly created

    ShortLinkAnalyticsSummary:
      type: object
      required: [short_code, successful_redirect_count, completeness_status]
      properties:
        short_code:
          type: string
        successful_redirect_count:
          type: integer
          minimum: 0
        last_successful_redirect_at:
          type: string
          format: date-time
          nullable: true
        completeness_status:
          type: string
          enum: [complete, degraded, incomplete]
          description: ADR-0009 three-state model. `incomplete` is sticky and never auto-reverts.

    HealthStatus:
      type: object
      required: [status, analytics]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unavailable]
          description: FR-111, URL shortener's own dependencies
        analytics:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [healthy, degraded]
              description: FR-115 — independent of any single short code's completeness_status
            degraded_since_unclean_shutdown_at:
              type: string
              format: date-time
              nullable: true
              description: >-
                APPROVED (spec.md FR-117, Human Gate 4 amendment,
                2026-09-10). Sticky after detection of an unclean prior
                shutdown; cleared only by an explicit, audited operator
                acknowledgment, never automatically from an empty backlog
                alone. Acknowledgment clears only this forward-looking
                warning — it never restores or asserts historical
                completeness for any short code; historical uncertainty
                remains visible in analytics evidence (audit trail and/or
                per-code completeness_status) regardless of acknowledgment.
                Implementation mechanism remains a Proposed ADR
                (docs/adr/0009) pending Human Gate 4 ADR acceptance — this
                field's contract semantics are approved independently of
                that mechanism decision.

    WorkflowCreateRequest:
      type: object
      required: [requirement]
      properties:
        requirement:
          type: string
        scenario:
          type: string
          enum: [greenfield, brownfield, ambiguous]
          nullable: true
        auto_execute:
          type: boolean
          default: false
          description: >-
            T106, added 2026-09-11 (MINOR, additive, backward-compatible --
            existing callers omitting this field are unaffected). When
            true, seeds a minimal demo pipeline (intake -> classify ->
            conditional branch, FR-202/T104) that the in-process background
            scheduler (src/orchestration/live_scheduler.py) drives
            automatically to completion, with no direct scheduler calls
            required from the caller. External agent adapters remain
            fail-closed regardless of this flag -- see ADR-0006.

    WorkflowStage:
      type: object
      required: [id, name, status, artifact_revision]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pending, ready, running, succeeded, failed_transient, failed_permanent, awaiting_approval, rejected, skipped]
        attempt_count:
          type: integer
        artifact_revision:
          type: string
        depends_on:
          type: array
          items:
            type: string
          description: stage IDs this stage depends on (the explicit dependency-graph edges, FR-201)

    WorkflowInstance:
      type: object
      required: [id, status, stages, decision_lineage]
      properties:
        id:
          type: string
          description: Correlation identifier (FR-601)
        feature_ref:
          type: string
        scenario:
          type: string
          enum: [greenfield, brownfield, ambiguous, "n/a"]
        status:
          type: string
          enum: [running, awaiting_approval, safe_stopped, completed, rejected]
        stages:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStage"
        decision_lineage:
          type: array
          items:
            type: object
            properties:
              decision_type:
                type: string
              detail:
                type: object
              created_at:
                type: string
                format: date-time

    ApprovalRequest:
      type: object
      properties:
        rationale:
          type: string
          nullable: true

    ApprovalDecision:
      type: object
      required: [id, gate_id, identity, role, decision, artifact_revision, created_at]
      properties:
        id:
          type: string
        gate_id:
          type: string
        identity:
          type: string
        role:
          type: string
          enum: [reviewer_approver, release_owner]
        decision:
          type: string
          enum: [approved, rejected, escalated_timeout]
        rationale:
          type: string
          nullable: true
        artifact_revision:
          type: string
        created_at:
          type: string
          format: date-time
        invalidated_at:
          type: string
          format: date-time
          nullable: true

    PolicyEvaluation:
      type: object
      required: [policy_id, policy_version, outcome, evaluated_at]
      properties:
        policy_id:
          type: string
        policy_version:
          type: string
        outcome:
          type: string
          enum: [PASS, FAIL, EXCEPTION-REQUESTED, NOT-APPLICABLE]
        evaluated_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      required: [actor_type, action, timestamp, affected_artifact_or_state, result, reason]
      properties:
        actor_type:
          type: string
          enum: [human, agent, system]
        action:
          type: string
        timestamp:
          type: string
          format: date-time
        affected_artifact_or_state:
          type: string
        result:
          type: string
        reason:
          type: string
        demonstration_flag:
          type: boolean

    ReliabilityMetrics:
      type: object
      required: [demonstration_data, success_rate, failure_rate, retry_frequency, mttr_seconds, unrecovered_failure_count]
      properties:
        demonstration_data:
          type: boolean
          description: MUST be true for any value produced by this prototype (FR-604) — never presented as a production statistic.
        success_rate:
          type: number
        failure_rate:
          type: number
        retry_frequency:
          type: number
        rollback_or_compensation_frequency:
          type: number
        mttr_seconds:
          type: number
          nullable: true
          description: Null until the ADR-0008 measurement population contains at least one recovered event. See ADR-0008 for the precise definition — no target value is approved yet.
        unrecovered_failure_count:
          type: integer
          description: Reported separately, never blended into mttr_seconds (per guide's explicit MTTR rule).

# Compatibility and Change Control
#
# Versioning: this file's `info.version` follows semantic versioning.
# MAJOR: a breaking change to any request/response schema or removed endpoint.
# MINOR: an additive, backward-compatible endpoint or optional field.
# PATCH: description/documentation-only changes.
#
# Every change to this contract requires: ownership identification, version-
# impact classification (above), backward-compatibility assessment, affected-
# consumer identification, updated contract tests, updated documentation, and
# — per FR-306 — recorded change approval before taking effect. This contract
# is PROPOSED (0.1.0-proposed) and not yet approved; version 1.0.0 is reserved
# for the first Human Gate 4-approved revision.
